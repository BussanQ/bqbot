name: Package release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching mygo.json (v0.1.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            targets: darwin/arm64,darwin/amd64
          - os: ubuntu-latest
            platform: windows
            targets: windows/amd64,windows/arm64
          - os: ubuntu-latest
            platform: linux
            targets: linux/amd64,linux/arm64
    runs-on: ${{ matrix.os }}
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test bundled driver preparation
        run: python3 -I tests/prepare_cua_test.py
      - name: Install Windows packaging tools
        if: matrix.platform == 'windows'
        run: sudo apt-get update && sudo apt-get install -y nsis osslsigncode
      - name: Prepare signing credentials
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: python3 -I scripts/release-signing.py
      - name: Configure signed release
        env:
          BQBOT_RELEASE_TAG: ${{ inputs.tag }}
          BQBOT_RELEASE_PLATFORM: ${{ matrix.platform }}
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: node scripts/configure-release.mjs
      - name: Build signed installers and updates
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RELEASE_TARGETS: ${{ matrix.targets }}
        run: go run github.com/egoist/mygo/cmd/mygo@v0.7.1 build -platform "$RELEASE_TARGETS"
      - name: Verify macOS app and embedded driver signatures
        if: matrix.platform == 'darwin'
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          import subprocess
          apps = list(Path('build').rglob('*.app'))
          if not apps:
              raise SystemExit('No macOS application bundle produced')
          for app in apps:
              resources = app / 'Contents/Resources/cua-driver'
              for name in ('cua-driver', 'manifest.json', 'LICENSE', 'NOTICE.md'):
                  if not (resources / name).is_file():
                      raise SystemExit('Missing bundled Cua resource: ' + name)
              subprocess.run(['codesign', '--verify', '--strict', str(resources / 'cua-driver')], check=True)
              subprocess.run(['codesign', '--verify', '--deep', '--strict', str(app)], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bqbot-${{ matrix.platform }}
          path: build/
          if-no-files-found: error
      - name: Remove temporary signing credentials
        if: always()
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python3 -I scripts/release-signing.py --clean
